    <circle cx="421.1" cy="881.0" r="18"/>
    <circle cx="260.0" cy="796.4" r="18"/>
    <circle cx="156.7" cy="646.7" r="18"/>
    <circle cx="134.8" cy="466.2" r="18"/>
    <circle cx="199.3" cy="296.1" r="18"/>
